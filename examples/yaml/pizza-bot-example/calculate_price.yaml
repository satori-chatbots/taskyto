name: calculate_price
kind: action
data:
  - pizza_size:
      type: enum
      values:
        - small
        - medium
        - large
  - pizza_type:
      type: enum
      values:
        - margherita
        - carbonara
        - marinera
        - hawaiian
        - four cheese
        - vegetarian

on-success:
  execute:
    language: python
    code: calculate_price.py
  response:
    text: "{{result}}"
    rephrase: simple